<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ddd;
        }

        main {
            display: flex;
            overflow-y: scroll;
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            padding: 20px;
            max-height: 90vh; /* Menjaga agar form tidak melebihi viewport */
        }

        header {
            background-color: lightblue;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            min-height: 80px; /* Menentukan tinggi minimal untuk header */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        section {
            padding: 20px;
            background-color: #fafafa;
            border-radius: 10px;
        }

        form {
            display: grid;
            gap: 10px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: lightblue;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
            font-size: 12px;
        }

        footer {
            background-color: lightblue;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }

        footer a {
            font-weight: bold;
            color: #333;
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Register</h1>
        </header>
        <section>
            <form th:method="post" th:action="@{/register}">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama" required>
                
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                
                <label for="confirmpassword">Confirm Password:</label>
                <input type="password" id="confirmpassword" name="confirmpassword" required>
                
                <input type="submit" value="Sign Up">
                
                <span class="error" th:if="${error != null}" th:text="${error}"></span>
            </form>
        </section>
        <footer>
            <p>Do you have an account? <a th:href="@{/login}">Login now</a></p>
        </footer>
    </main>
</body>
</html>
