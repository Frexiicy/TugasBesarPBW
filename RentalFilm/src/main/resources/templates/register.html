<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{css/style-login.css}">
    <title>Register</title>
</head>
<body>
    <main>
        <header>
            <img class="img" th:src="@{/images/rentalfilm.png}">
        </header>
        <section>
            <h1>REGISTER</h1>
            <form th:method="post" th:action="@{/register}">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama" required>
                
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                
                <label for="confirmpassword">Confirm Password:</label>
                <input type="password" id="confirmpassword" name="confirmpassword" required>
                
                <input type="submit" value="Sign Up">
                
                <span class="error" th:if="${error != null}" th:text="${error}"></span>
            </form>
        </section>
        <footer>
            <p>Do you have an account? <a th:href="@{/login}">Login now</a></p>
        </footer>
    </main>
</body>
</html>
