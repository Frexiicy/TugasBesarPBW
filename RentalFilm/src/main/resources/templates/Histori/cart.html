<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{css/style-cart.css}">
        <title>Keranjang</title>
    </head>
    <body>
        <div th:replace="Fragments/header-user :: header"></div>
        
        <form method="POST" th:action="@{/checkout}">
            <div class="container">  
                <ul class="table">
                    <li class="table-row" th:each="keranjang : ${keranjang}">
                        <div class="col cover"></div>
                        <div class="details">
                            <div class="col judul" th:text="${keranjang.judul}">Film Title Goes Here</div>
                            <div class="col harga" th:text="${keranjang.harga}">Rp10,000</div>
                        </div>
                        <div class="add-to-cart"><input type="checkbox" name="selectedFilm" th:value="${keranjang.id}"></div>
                    </li>
                </ul>
            </div>
            <button class="button" type="submit">Checkout</button>
        </form>
    </body>
</html>
