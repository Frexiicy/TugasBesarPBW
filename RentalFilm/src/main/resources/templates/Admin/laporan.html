<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Laporan Penyewaan Film</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/laporan.css">
</head>
<body>
    <h1>Laporan Penyewaan Film</h1>

    <!-- Tabel Penyewaan -->
    <section>
        <h2>Laporan Penyewaan</h2>
        <table>
            <thead>
                <tr>
                    <th>Judul Film</th>
                    <th>Tanggal Sewa</th>
                    <th>Tanggal Kembali</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="laporan : ${laporanPeminjaman}">
                    <td th:text="${laporan.judul}"></td>
                    <td th:text="${laporan.tanggalSewa}"></td>
                    <td th:text="${laporan.tanggalKembali}"></td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- Grafik Penyewaan -->
    <section>
        <h2>Grafik Penyewaan</h2>
        <canvas id="rentalChart"></canvas>
    </section>

    <!-- Tombol Unduh Laporan PDF -->
    <button onclick="downloadPDF()">Unduh Laporan PDF</button>
</body>
</html>
