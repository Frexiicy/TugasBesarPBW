<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Film</title>
  <link rel="stylesheet" th:href="@{/css/style-edit_film.css}">

<body>

    <div class="header-container">
      <span>Hi, Admin</span>
      <button id="logout">Logout</button>
    </div>

  <div class="main-container">

      <ul class="sidebar">
        <li><a th:href="@{/dashboard}">Dashboard</a></li>
        <li><a>Edit Film</a></li>
        <li><a th:href="@{/addGenre}">Add Genre</a></li>
        <li><a th:href="@{/addActor}">Add Actor</a></li>
      </ul>
    </aside>

    <main>
      <div class="form-container">
        <h1>Edit Film</h1>
        <form th:action="@{/editFilm}" method="post" enctype="multipart/form-data">
          <input type="hidden" name="id" th:value="${film.id}">

          <div class="form-group">
            <label for="poster">Update Poster</label>
            <input type="file" id="poster" accept="image/*" onchange="previewImage(event)">
            <img id="poster-preview" alt="Preview Poster" style="display: none;">
            <input type="hidden" name="posterBase64" id="poster-base64">
          </div>

          <div class="form-group">
            <label for="judul">Title</label>
            <input type="text" id="judul" name="judul" placeholder="Enter title" th:value="${film.judul}" required>
          </div>

          <!-- <div class="form-group">
            <label for="rating">Rating</label>
            <div class="rating-stars">
              <span onclick="setRating(1)" class="star" th:classappend="${film.rating >= 1} ? 'filled' : ''">&#9733;</span>
              <span onclick="setRating(2)" class="star" th:classappend="${film.rating >= 2} ? 'filled' : ''">&#9733;</span>
              <span onclick="setRating(3)" class="star" th:classappend="${film.rating >= 3} ? 'filled' : ''">&#9733;</span>
              <span onclick="setRating(4)" class="star" th:classappend="${film.rating >= 4} ? 'filled' : ''">&#9733;</span>
              <span onclick="setRating(5)" class="star" th:classappend="${film.rating >= 5} ? 'filled' : ''">&#9733;</span>
            </div>
            <input type="hidden" id="rating-value" name="rating" th:value="${film.rating}">
          </div>

          <div class="form-group">
            <label for="aktor">Actor</label>
            <div id="aktor-container">
              <input type="text" name="aktor" placeholder="Search actor..." list="aktor-list" class="aktor-input" th:value="${film.actors}" />
            </div>
            <button type="button" id="add-actor">Add Actor</button>
            <datalist id="aktor-list">
              <option th:each="actor : ${actors}" th:value="${actor.nama}" th:text="${actor.nama}"></option>
            </datalist>
          </div>

          <div class="form-group">
            <label>Genre</label>
            <div class="genre-checkboxes">
              <label th:each="genre : ${genres}" class="genre">
                <input type="checkbox" name="genres" th:value="${genre.id}"
                  th:checked="${#fields.hasErrors('genres') ? false : (film.genres != null && #lists.contains(film.genres, genre))}">
                <span th:text="${genre.nama}"></span>
              </label>
            </div>
          </div> -->

          <div class="form-group">
            <label for="sinopsis">Summary</label>
            <textarea id="sinopsis" name="sinopsis" rows="4" placeholder="Edit the summary" th:text="${film.sinopsis}"></textarea>
          </div>

          <div class="form-group">
            <label for="batasan">Age Restriction</label>
            <select id="batasan" name="batas_usia">
              <option value="all" th:selected="${film.batas_usia == 'all'}">All Ages</option>
              <option value="13" th:selected="${film.batas_usia == '13'}">13+</option>
              <option value="17" th:selected="${film.batas_usia == '17'}">17+</option>
              <option value="21" th:selected="${film.batas_usia == '21'}">21+</option>
            </select>
          </div>

          <div class="form-group">
            <label for="stok">Stock</label>
            <input type="number" name="stok" id="stok" placeholder="Update stock" min="0" th:value="${film.stok}">
          </div>

          <div class="form-actions">
            <button type="reset" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-save">Update</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>

<script>
  function previewImage(event) {
    const file = event.target.files[0];
    const reader = new FileReader();

    reader.onloadend = function () {
      const base64String = reader.result.split(',')[1];
      document.getElementById('poster-base64').value = base64String;
      document.getElementById('poster-preview').src = reader.result;
      document.getElementById('poster-preview').style.display = "block";
    };

    if (file) {
      reader.readAsDataURL(file);
    }
  }

  let stars = document.getElementsByClassName("star");

  function setRating(n) {
    document.getElementById("rating-value").value = n;
    for (let i = 0; i < stars.length; i++) {
      if (i < n) {
        stars[i].classList.add("filled");
      } else {
        stars[i].classList.remove("filled");
      }
    }
  }

  let actorCount = 1;
  document.getElementById("add-actor").addEventListener("click", function () {
    if (actorCount < 4) {
      actorCount++;
      let newInput = document.createElement("input");
      newInput.type = "text";
      newInput.name = "aktor";
      newInput.placeholder = "Search actor...";
      newInput.classList.add("aktor-input");
      newInput.setAttribute("list", "aktor-list");
      document.getElementById("aktor-container").appendChild(newInput);
    } else {
      alert("You can only add up to 4 actors.");
    }
  });
</script>
